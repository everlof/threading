<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 128 128"
  role="img"
  aria-labelledby="threading-mark-title"
>
  <title id="threading-mark-title">Threading</title>
  <defs>
    <path
      id="corner-thread"
      d="M 64 12 C 66 29 67 43 58.5 58.5"
    />
    <linearGradient
      id="thread-gradient"
      x1="64"
      y1="12"
      x2="58.5"
      y2="58.5"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#C95726" />
      <stop offset="0.42" stop-color="#D9692B" />
      <stop offset="0.7" stop-color="#FF9A3D" />
      <stop offset="1" stop-color="#FF9A3D" />
    </linearGradient>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path
      d="M 64 10 Q 85.39 26.96 110.77 37 Q 106.77 64 110.77 91 Q 85.39 101.04 64 118 Q 42.61 101.04 17.23 91 Q 21.23 64 17.23 37 Q 42.61 26.96 64 10 Z"
      stroke="#C95726"
      stroke-width="7"
    />

    <g stroke-width="7.5">
      <use href="#corner-thread" stroke="url(#thread-gradient)" />
      <use
        href="#corner-thread"
        stroke="url(#thread-gradient)"
        transform="rotate(60 64 64)"
      />
      <use
        href="#corner-thread"
        stroke="url(#thread-gradient)"
        transform="rotate(120 64 64)"
      />
      <use
        href="#corner-thread"
        stroke="url(#thread-gradient)"
        transform="rotate(180 64 64)"
      />
      <use
        href="#corner-thread"
        stroke="url(#thread-gradient)"
        transform="rotate(240 64 64)"
      />
      <use
        href="#corner-thread"
        stroke="url(#thread-gradient)"
        transform="rotate(300 64 64)"
      />
    </g>
  </g>
  <path
    d="M 64 56.5 L 70.5 60.25 L 70.5 67.75 L 64 71.5 L 57.5 67.75 L 57.5 60.25 Z"
    fill="#FF9A3D"
  />
</svg>
