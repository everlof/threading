# Builds a nightly from master: same quality gate, same notarization, same scripts as a
# release — only the channel, the version, and the feed differ.
#
# Nightlies get their own feed, never a channel tag on the stable one: a nightly's date
# version (2026.8.6) outranks every 1.x under Sparkle's comparator, so in a shared feed a
# nightly install would permanently outrank stable and stop seeing updates the moment it
# should return there (releasing.md). The feed lives at a *rolling* prerelease tag —
#   https://github.com/everlof/threading/releases/download/nightly/appcast.xml
# — which AppUpdater selects for nightly-channel builds. A prerelease never becomes
# `releases/latest`, so the stable feed never sees these.
#
# An unmoved master is skipped: rebuilding the same commit publishes an update no installed
# nightly can use (its version is the date, but its content is identical).
#
# Requires the same secrets as release.yml. Automatic scheduling stays disabled until those
# secrets are configured; workflow_dispatch keeps the pipeline available for a deliberate test.

name: Nightly

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly

jobs:
  nightly:
    # Apple silicon, and not negotiable: Threading builds arm64 only
    # (ARCHS[sdk=macosx*] = arm64) and ThirdParty/scc/scc is deliberately a single arm64 slice.
    # An Intel runner cannot execute either -- Rosetta translates x86 on Apple silicon, not the
    # reverse -- so check_bundled_scc.sh dies with exit 126 before a single test runs, and the
    # arm64 test bundle could not have run after it. This was macos-15-intel from a25c3afb until
    # 2026-08-26, which is why every run since failed identically.
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0

      - name: Skip if master has not moved
        id: moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The peeled ref (^{}) is the commit whichever kind of tag exists; the plain ref is
          # only right for the lightweight tag gh creates. Prefer peeled where present.
          last="$(git ls-remote --tags origin | awk '$2 == "refs/tags/nightly^{}" { peeled = $1 } $2 == "refs/tags/nightly" { plain = $1 } END { print (peeled != "" ? peeled : plain) }')"
          head="$(git rev-parse HEAD)"
          if [ "$last" = "$head" ]; then
            echo "master is still $head — nothing to build"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select the newest Xcode 26
        if: steps.moved.outputs.changed == 'true'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Prepare policy tools
        if: steps.moved.outputs.changed == 'true'
        run: |
          # Installed rather than asserted. The runner image shipped SwiftLint when these
          # workflows were written and no longer does, which failed the first real release run
          # at exit 127; gitleaks was never on it and was added to ci.sh without being added
          # here, which failed the next one. An image dropping a tool should cost a slower job,
          # not a broken release.
          command -v swiftlint >/dev/null || brew install swiftlint
          command -v rg >/dev/null || brew install ripgrep
          command -v gitleaks >/dev/null || brew install gitleaks
          command -v sentry-cli >/dev/null || brew install getsentry/tools/sentry-cli
          python3 -m pip install --disable-pip-version-check \
            -r scripts/requirements-schema.txt
          swiftlint version
          gitleaks version
          sentry-cli --version

      - name: Import the Developer ID certificate
        if: steps.moved.outputs.changed == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

      - name: Store the notary credentials
        if: steps.moved.outputs.changed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials threading-ci \
            --apple-id "$APPLE_ID" --team-id SMQ3E8Y57T --password "$APPLE_APP_PASSWORD"

      - name: Resolve Sparkle's command-line tools
        if: steps.moved.outputs.changed == 'true'
        run: |
          # -disableAutomaticPackageResolution: resolve exactly the committed Package.resolved.
          # Without it, a floating pin (Sparkle is upToNextMinor) rewrites the tracked file the
          # day a new patch ships, and publish_release.sh's clean-worktree preflight fails.
          xcodebuild -resolvePackageDependencies \
            -disableAutomaticPackageResolution \
            -project Threading.xcodeproj -scheme Threading \
            -derivedDataPath "$RUNNER_TEMP/dd"
          echo "THREADING_SPARKLE_BIN=$RUNNER_TEMP/dd/SourcePackages/artifacts/sparkle/Sparkle/bin" >> "$GITHUB_ENV"

      - name: Write the Sparkle private key
        if: steps.moved.outputs.changed == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          KEY_FILE="$RUNNER_TEMP/sparkle-ed25519"
          (umask 077; printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE")
          echo "THREADING_SPARKLE_PRIVATE_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Build and notarize the nightly
        if: steps.moved.outputs.changed == 'true'
        env:
          NOTARY_PROFILE: threading-ci
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: threading
          SENTRY_PROJECT: threading-macos
        run: |
          # The date as dotted digits, zero-padding stripped — 2026.8.6, the shape
          # releasing.md's channel table records, satisfying both the release script's
          # dotted-digits guard and Sparkle's ordering within this feed.
          y="$(date -u +%Y)"; m="$(date -u +%m)"; d="$(date -u +%d)"
          VERSION="$y.${m#0}.${d#0}"
          echo "THREADING_VERSION=$VERSION" >> "$GITHUB_ENV"
          THREADING_VERSION="$VERSION" scripts/release.sh --notarize --channel nightly

      - name: Generate the nightly appcast
        if: steps.moved.outputs.changed == 'true'
        run: |
          {
            echo "Nightly build of \`$(git rev-parse --short HEAD)\`, $(date -u +%Y-%m-%d)."
            echo
            echo "## Commits since the previous nightly"
            echo
            last="$(git ls-remote --tags origin | awk '$2 == "refs/tags/nightly^{}" { peeled = $1 } $2 == "refs/tags/nightly" { plain = $1 } END { print (peeled != "" ? peeled : plain) }')"
            if [ -n "$last" ] && git cat-file -e "$last" 2>/dev/null; then
              git log --format='- %s' "$last"..HEAD | head -100
            else
              echo "- First nightly."
            fi
          } > "$RUNNER_TEMP/nightly-notes.md"
          THREADING_RELEASE_TAG=nightly \
          THREADING_RELEASE_NOTES_FILE="$RUNNER_TEMP/nightly-notes.md" \
          THREADING_DOWNLOAD_URL_PREFIX="https://github.com/${{ github.repository }}/releases/download/nightly/" \
            scripts/generate_appcast.sh

      - name: Publish the rolling nightly release
        if: steps.moved.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: threading
          SENTRY_PROJECT: threading-macos
        run: |
          # Gapless roll: the previous nightly's feed stays live until the replacement is in
          # place. Assets go up first — the appcast last, so it never names a zip that is not
          # uploaded yet — then the tag is force-moved server-side via the API. Nothing here
          # runs `git push` (see CLAUDE.md on why local pushes are never scripted), and a
          # failure at any step leaves yesterday's nightly serving rather than a 404.
          sha="$(git rev-parse HEAD)"
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly "build/release/Threading-$THREADING_VERSION.zip" --clobber
            gh release upload nightly "build/release/appcast.xml" --clobber
            gh api "repos/${{ github.repository }}/git/refs/tags/nightly" \
              -X PATCH -f sha="$sha" -F force=true
            gh release edit nightly \
              --title "Nightly $THREADING_VERSION" \
              --notes-file "$RUNNER_TEMP/nightly-notes.md"
            # Date-named zips accumulate on a rolling release; keep only the one the feed names.
            gh release view nightly --json assets -q '.assets[].name' \
              | grep -E '^Threading-.*\.zip$' \
              | grep -v "^Threading-$THREADING_VERSION.zip$" \
              | while IFS= read -r asset; do
                  gh release delete-asset nightly "$asset" --yes || true
                done
          else
            gh release create nightly \
              "build/release/Threading-$THREADING_VERSION.zip" \
              "build/release/appcast.xml" \
              --prerelease \
              --target "$sha" \
              --title "Nightly $THREADING_VERSION" \
              --notes-file "$RUNNER_TEMP/nightly-notes.md"
          fi
          scripts/sentry-release.sh deploy \
            --release-file build/release/sentry-release.txt \
            --environment nightly \
            --url "https://github.com/${{ github.repository }}/releases/tag/nightly"

      - name: Remove the Sparkle private key
        if: always()
        run: rm -f "$RUNNER_TEMP/sparkle-ed25519"
