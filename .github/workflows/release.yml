# Builds, notarizes, and publishes a tagged release, entirely through the same scripts a
# release from a Mac uses — scripts/publish_release.sh is the single implementation, and this
# workflow only provisions what a fresh runner lacks: the signing certificate, the notary
# credentials, and Sparkle's private key. Maintaining the steps here instead would be the
# second list scripts/ci.sh exists to avoid.
#
# Trigger: push an annotated tag `vX.Y.Z` (by hand — pushes from the release machine recurse
# into the submodule forks, so scripts never push; see CLAUDE.md).
#
# Required repository secrets:
#   APPLE_CERTIFICATE_P12       base64 of a .p12 export of the Developer ID Application
#                               certificate and its private key
#   APPLE_CERTIFICATE_PASSWORD  the .p12's password
#
# No provisioning profile is needed. The app ships no com.apple.developer.* entitlement, so a
# Developer ID export signs with the certificate alone — see releasing.md for why Sign in with
# Apple was dropped rather than provisioned for. If a restricted capability is ever added back,
# this workflow needs a profile secret again and scripts/release.sh will refuse until it has one.
#   APPLE_ID                    the Apple ID that owns the certificate
#   APPLE_APP_PASSWORD          an app-specific password for that Apple ID (notarytool)
#   SPARKLE_PRIVATE_KEY         the contents of the file written by
#                               generate_keys -x <file> --account mjukis-threading — the
#                               base64 EdDSA seed. Threading's own key, deliberately not
#                               claudex's, so this secret can never sign a claudex update;
#                               see releasing.md.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  publish:
    # Apple silicon, and not negotiable: Threading builds arm64 only
    # (ARCHS[sdk=macosx*] = arm64) and ThirdParty/scc/scc is deliberately a single arm64 slice.
    # An Intel runner cannot execute either -- Rosetta translates x86 on Apple silicon, not the
    # reverse -- so check_bundled_scc.sh dies with exit 126 before a single test runs, and the
    # arm64 test bundle could not have run after it. This was macos-15-intel from a25c3afb until
    # 2026-08-26, which is why every run since failed identically.
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          # The publish script verifies the annotated tag object and its remote twin;
          # a shallow clone has neither.
          fetch-depth: 0

      - name: Select the newest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Prepare policy tools
        run: |
          # SwiftLint is part of the macOS 15 runner image; ripgrep is not guaranteed.
          swiftlint version
          brew install ripgrep

      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

      - name: Store the notary credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials threading-ci \
            --apple-id "$APPLE_ID" --team-id SMQ3E8Y57T --password "$APPLE_APP_PASSWORD"

      - name: Resolve Sparkle's command-line tools
        run: |
          # -disableAutomaticPackageResolution: resolve exactly the committed Package.resolved.
          # Without it, a floating pin (Sparkle is upToNextMinor) rewrites the tracked file the
          # day a new patch ships, and publish_release.sh's clean-worktree preflight fails.
          xcodebuild -resolvePackageDependencies \
            -disableAutomaticPackageResolution \
            -project Threading.xcodeproj -scheme Threading \
            -derivedDataPath "$RUNNER_TEMP/dd"
          echo "THREADING_SPARKLE_BIN=$RUNNER_TEMP/dd/SourcePackages/artifacts/sparkle/Sparkle/bin" >> "$GITHUB_ENV"

      - name: Write the Sparkle private key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          KEY_FILE="$RUNNER_TEMP/sparkle-ed25519"
          (umask 077; printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE")
          echo "THREADING_SPARKLE_PRIVATE_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Build, notarize, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARY_PROFILE: threading-ci
        run: scripts/publish_release.sh

      - name: Remove the Sparkle private key
        if: always()
        run: rm -f "$RUNNER_TEMP/sparkle-ed25519"

