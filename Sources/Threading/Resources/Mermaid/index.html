<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <style>
    html, body { margin: 0; min-height: 100%; background: transparent; }
    /* The family is a floor under the theme's list: never the engine's default serif. */
    body { overflow: auto; font-family: -apple-system, sans-serif; }
    #canvas { box-sizing: border-box; width: max-content; min-width: 100%; }
    svg { display: block; max-width: none !important; }
    a { pointer-events: none; }
  </style>
  <script src="mermaid.tiny.js" defer></script>
  <script src="viewer.js" defer></script>
</head>
<body><main id="canvas"><div id="diagram" role="img"></div></main></body>
</html>
