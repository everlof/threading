<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title data-i18n="app.title">Threading Remote</title>
  <!--
    Vendored, pinned: xterm.js 5.3.0 (MIT).
      xterm.js  sha256 f0aea0f75f48559013ae6643c2479dd737d26da42d5524e6d2b70915ae6523c7
      xterm.css sha256 832f3f2c603b43ad4351ff04970150cc7a873014276db126a6065c6dd81e4872
    The bearer token lives in the URL fragment (never sent to a server); app.js reads it.
  -->
  <link rel="stylesheet" href="/xterm.css" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header id="bar">
    <button id="back" hidden aria-label="Back to sessions" data-i18n-aria-label="nav.back">‹</button>
    <span id="title" data-i18n="app.title">Threading Remote</span>
    <span id="badge" hidden></span>
  </header>

  <main id="content">
    <section id="status" class="pad" role="status" aria-live="polite" data-i18n="status.connecting">Connecting…</section>
    <ul id="sessions" hidden></ul>
    <div id="terminal" hidden></div>
    <section id="conversation" hidden>
      <div id="conversationRows" aria-live="polite"></div>
      <form id="composer">
        <textarea
          id="prompt"
          rows="1"
          placeholder="Add feedback…"
          aria-label="Message"
          data-i18n-placeholder="composer.placeholder"
          data-i18n-aria-label="composer.message"
        ></textarea>
        <button id="send" type="submit" aria-label="Send" data-i18n-aria-label="composer.send" disabled>↑</button>
      </form>
    </section>
  </main>

  <script src="/xterm.js"></script>
  <script src="/app.js"></script>
</body>
</html>
